<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Стрелочки</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        #header {
            text-align: center;
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
        }
        #game-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 100px;
            position: relative;
        }
        .arrow {
            position: absolute;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        #controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 20px;
            max-width: 400px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }
        .btn {
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 15px;
            font-size: 40px;
            padding: 20px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.1s;
        }
        .btn:active {
            transform: scale(0.95);
            background-color: var(--tg-theme-button-color, #2b7cd6);
        }
        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            text-align: center;
            padding: 20px;
        }
        .play-btn {
            margin-top: 20px;
            padding: 15px 40px;
            font-size: 20px;
            background: var(--tg-theme-button-color, #3390ec);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="header">Счет: <span id="score">0</span></div>
    <div id="game-area">
        <div id="current-arrow" class="arrow">⬆️</div>
    </div>
    <div id="controls">
        <button class="btn" data-dir="up">⬆️</button>
        <button class="btn" data-dir="down">⬇️</button>
        <button class="btn" data-dir="left">⬅️</button>
        <button class="btn" data-dir="right">➡️</button>
    </div>

    <div id="start-screen" class="overlay">
        <h1>Стрелочки</h1>
        <p>Нажимай правильную стрелку, пока время не вышло!</p>
        <button class="play-btn" id="start-btn">Начать игру</button>
    </div>

    <div id="game-over-screen" class="overlay hidden">
        <h1>Игра окончена</h1>
        <p>Твой счет: <span id="final-score">0</span></p>
        <button class="play-btn" id="restart-btn">Играть снова</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        function haptic(type) {
            if (tg.HapticFeedback) {
                if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
                else if (type === 'error') tg.HapticFeedback.notificationOccurred('error');
                else tg.HapticFeedback.impactOccurred(type);
            }
        }

        const arrows = { up: '⬆️', down: '⬇️', left: '⬅️', right: '➡️' };
        const dirs = ['up', 'down', 'left', 'right'];
        let score = 0;
        let currentDir = '';
        let timeoutId;
        let isPlaying = false;

        const scoreEl = document.getElementById('score');
        const arrowEl = document.getElementById('current-arrow');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreEl = document.getElementById('final-score');

        function nextArrow() {
            currentDir = dirs[Math.floor(Math.random() * dirs.length)];
            arrowEl.textContent = arrows[currentDir];
            arrowEl.style.display = 'block';

            let timeLimit = Math.max(600, 1500 - score * 30);
            
            clearTimeout(timeoutId);
            timeoutId = setTimeout(() => {
                if (isPlaying) gameOver();
            }, timeLimit);
        }

        function startGame() {
            score = 0;
            scoreEl.textContent = score;
            isPlaying = true;
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            nextArrow();
        }

        function gameOver() {
            isPlaying = false;
            clearTimeout(timeoutId);
            arrowEl.style.display = 'none';
            finalScoreEl.textContent = score;
            gameOverScreen.classList.remove('hidden');
            haptic('error');
        }

        document.querySelectorAll('.btn').forEach(btn => {
            btn.addEventListener('click', () => {
                if (!isPlaying) return;
                const dir = btn.getAttribute('data-dir');
                if (dir === currentDir) {
                    score++;
                    scoreEl.textContent = score;
                    haptic('success');
                    clearTimeout(timeoutId);
                    nextArrow();
                } else {
                    haptic('error');
                    gameOver();
                }
            });
        });

        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', startGame);
    </script>
</body>
</html>
